[package]
name = "rust"
version = "0.1.0"
edition = "2024"

[lib]
name = "rust"
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22.1"
percent-encoding = "2.3.2"
lz-str = "0.2"
flate2 = "1.0"
pyo3 = { version = "0.28.0", features = ["extension-module"] }
pythonize = "0.28.0"
